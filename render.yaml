# One-click deploy of the full version (admin panel + database + email) on Render.
# Render dashboard → New → Blueprint → select this repository.
services:
  - type: web
    name: rudelman-law
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NOTIFY_TO
        value: recepcion@rudelmanlaw.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
